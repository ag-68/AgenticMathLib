[project]
name = "agent-ready-libs"
version = "0.1.0"
description = "Agent-ready numerical tooling, measured on a math library and a slice of Sionna."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eval-harness",
    "mathlib-mcp",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared/eval_harness",
    "01-mathlib-mcp-lite",
]

[tool.uv.sources]
eval-harness = { workspace = true }
mathlib-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
    "shared/eval_harness/src",
    "01-mathlib-mcp-lite/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "shared/eval_harness/tests",
    "01-mathlib-mcp-lite/tests",
]
