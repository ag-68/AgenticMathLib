[project]
name = "eval-harness"
version = "0.1.0"
description = "Shared evaluation harness for agentic math tools."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
eval = "eval_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
