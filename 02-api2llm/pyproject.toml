[project]
name = "api2llm"
version = "0.1.0"
description = "Generate agent-ready artifacts and a readiness score from a Python library."
requires-python = ">=3.11"
dependencies = [
    "eval-harness",
]

[tool.uv.sources]
eval-harness = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
